<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý phòng</title>
<link rel="stylesheet" href="rooms.css">
</head>

<body>

<div class="topbar">
<div class="left">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<h2>Quản lý phòng</h2>
</div>

<div class="user-box" onclick="toggleUserMenu()">
<div class="avatar-text">👤</div>
<span id="username"></span>

<div class="user-menu" id="userMenu">
<div onclick="openMyInfo()">👤 Thông tin của tôi</div>
<div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
<div onclick="logout()">🚪 Đăng xuất</div>
</div>
</div>
</div>

<div class="wrapper">

<div class="sidebar" id="sidebar"></div>

<div class="main">

<!-- TOOLBAR -->

<div class="toolbar">

<input id="key" placeholder="🔍 Tìm theo tên phòng..." oninput="render()">

<select id="buildingFilter" onchange="render()">
<option value="">Tất cả tòa</option>
<option value="B1">Tòa 1</option>
<option value="B2">Tòa 2</option>
<option value="B3">Tòa 3</option>
<option value="B4">Tòa 4</option>
<option value="B5">Tòa 5</option>
</select>

<select id="status" onchange="render()">
<option value="">Tất cả trạng thái</option>
<option>Trống</option>
<option>Đang thuê</option>
<option>Đang sửa</option>
</select>

<button class="add" onclick="openAddRoom()">➕ Thêm phòng</button>

</div>


<!-- CARDS -->

<div class="cards">

<div class="card"><h4>Tổng phòng</h4><p id="total">0</p></div>
<div class="card"><h4>Đang thuê</h4><p id="thue">0</p></div>
<div class="card"><h4>Phòng trống</h4><p id="trong">0</p></div>
<div class="card"><h4>Đang sửa</h4><p id="sua">0</p></div>

</div>


<!-- TABLE -->

<div class="section">

<table>

<thead>
<tr>
<th>Mã</th>
<th>Tên phòng</th>
<th>Tòa</th>
<th>Giá</th>
<th>Trạng thái</th>
<th>Hành động</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</div>
</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="box">

<h3 id="modalTitle">Thêm phòng</h3>

<input id="mRoomName" placeholder="Tên phòng">

<select id="mBuilding">
<option value="B1">Tòa 1</option>
<option value="B2">Tòa 2</option>
<option value="B3">Tòa 3</option>
<option value="B4">Tòa 4</option>
<option value="B5">Tòa 5</option>
</select>

<input id="mPrice" placeholder="Giá phòng">

<select id="mStatus">
<option value="TRONG">Trống</option>
<option value="DANG_THUE">Đang thuê</option>
<option value="DANG_SUA">Đang sửa</option>
</select>

<div class="modal-actions">
<button onclick="saveRoom()">💾 Lưu</button>
<button onclick="closeModal()">❌ Hủy</button>
</div>

</div>

</div>


<script src="../Common/menu.js"></script>
<script src="api.js"></script>
<script src="rooms.js"></script>

</body>
</html>
