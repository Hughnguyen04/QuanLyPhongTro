<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý hóa đơn</title>
    <link rel="stylesheet" href="../Common/layout.css">
    <link rel="stylesheet" href="bills.css">
</head>

<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Quản lý hóa đơn</h2>
    </div>

    <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

    <div class="user-menu" id="userMenu">
        <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
        <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
        <div onclick="logout()">🚪 Đăng xuất</div>
    </div>
    </div>
</div>

<div class="wrapper">

    <div class="sidebar" id="sidebar"></div>

    <div class="main">

        <div class="filter-bar">
            <input id="key" placeholder="🔍 Tìm phòng..." oninput="render()">

            <select id="buildingFilter" onchange="render()">
                <option value="">Tất cả tòa</option>
            </select>

            <select id="monthFilter" onchange="render()">
                <option value="">Tất cả tháng</option>
            </select>

            <select id="statusFilter" onchange="render()">
                <option value="">Tất cả trạng thái</option>
                <option value="Chưa thanh toán">Chưa thanh toán</option>
                <option value="Đã thanh toán">Đã thanh toán</option>
            </select>

            <button class="add">➕ Thêm hóa đơn</button>
        </div>

        <div class="cards">
            <div class="card"><h4>Tổng hóa đơn</h4><p id="total">0</p></div>
            <div class="card"><h4>Chưa thanh toán</h4><p id="unpaid">0</p></div>
            <div class="card"><h4>Đã thanh toán</h4><p id="paid">0</p></div>
            <div class="card"><h4>Tổng tiền</h4><p id="sum">0</p></div>
        </div>

        <!-- TABLE -->
        <div class="section">
            <table class="table">
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Phòng</th>
                        <th>Tòa</th>
                        <th>Tháng</th>
                        <th>Điện</th>
                        <th>Nước</th>
                        <th>Tổng</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="../Common/menu.js"></script>
<script src="../Common/data.js"></script>
<script src="bills.js"></script>
</body>
</html>
