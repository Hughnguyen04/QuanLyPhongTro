<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý chỉ số điện nước</title>
    <link rel="stylesheet" href="../Common/layout.css">
    <link rel="stylesheet" href="meter.css">
</head>
<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Chỉ số điện nước</h2>
    </div>
        <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

        <div class="user-menu" id="userMenu">
            <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
            <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
            <div onclick="logout()">🚪 Đăng xuất</div>
        </div>
    </div>
</div>

<div class="wrapper">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">

        <!-- CARDS -->
        <div class="cards">
            <div class="card"><h4>Tổng phòng</h4><p id="totalRooms">0</p></div>
            <div class="card"><h4>Tổng tiền điện</h4><p id="totalElectric">0</p></div>
            <div class="card"><h4>Tổng tiền nước</h4><p id="totalWater">0</p></div>
            <div class="card"><h4>Tổng tiền cộng</h4><p id="totalCost">0</p></div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <input type="text" id="key" placeholder="🔍 Tìm phòng..." oninput="render()">
            <select id="buildingFilter" onchange="render()">
                <option value="">Tất cả tòa</option>
            </select>
            <select id="monthFilter" onchange="render()"></select>
            <select id="yearFilter" onchange="render()"></select>
        </div>

        <!-- TABLE -->
        <div class="section">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Phòng</th>
                        <th>Tòa</th>
                        <th>Tháng/Năm</th>
                        <th>Điện cũ</th>
                        <th>Điện mới</th>
                        <th>Tiêu thụ</th>
                        <th>Nước cũ</th>
                        <th>Nước mới</th>
                        <th>Tiêu thụ</th>
                        <th>Thành tiền</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- MODAL CHI TIẾT -->
<div class="modal" id="detailModal">
    <div class="box">
        <h3 id="detailTitle">Lịch sử chỉ số điện nước</h3>
        <div id="detailBody"></div>
        <div class="modal-actions">
            <button onclick="closeDetailModal()" class="secondary">❌ Đóng</button>
        </div>
    </div>
</div>

<!-- MODAL SỬA CHỈ SỐ -->
<div class="modal" id="editModal">
    <div class="box">
        <h3>Sửa chỉ số điện nước</h3>
        
        <div class="form-group">
            <label>Phòng</label>
            <input type="text" id="editRoomName" readonly>
        </div>
        
        <div class="form-group">
            <label>Tháng / Năm</label>
            <div style="display:flex; gap:10px;">
                <select id="editMonth" style="flex:1"></select>
                <select id="editYear" style="flex:1"></select>
            </div>
        </div>

        <div class="form-group">
            <label>Điện cũ (kWh)</label>
            <input type="number" id="editElectricOld" placeholder="Nhập số điện cũ">
        </div>
        <div class="form-group">
            <label>Điện mới (kWh)</label>
            <input type="number" id="editElectricNew" placeholder="Nhập số điện mới">
        </div>
        <div class="form-group">
            <label>Nước cũ (m³)</label>
            <input type="number" id="editWaterOld" placeholder="Nhập số nước cũ">
        </div>
        <div class="form-group">
            <label>Nước mới (m³)</label>
            <input type="number" id="editWaterNew" placeholder="Nhập số nước mới">
        </div>

        <div class="modal-actions">
            <button onclick="saveUtility()" class="primary">💾 Lưu thay đổi</button>
            <button onclick="closeEditModal()" class="secondary">❌ Hủy</button>
        </div>
    </div>
</div>

<script src="../Common/menu.js"></script>
<script src="api.js"></script>
<script src="meter.js"></script>

</body>
</html>
