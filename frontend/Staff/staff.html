<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý nhân viên</title>
<link rel="stylesheet" href="../Common/layout.css">
<link rel="stylesheet" href="staff.css">
</head>

<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Quản lý nhân viên</h2>
    </div>

    <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

        <div class="user-menu" id="userMenu">
            <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
            <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
            <div onclick="logout()">🚪 Đăng xuất</div>
        </div>
    </div>
</div>

<div class="wrapper">
<div class="sidebar" id="sidebar"></div>

<div class="main">

<!-- TOOLBAR -->
<div class="toolbar">
<input id="key" placeholder="🔍 Tìm theo tên..." oninput="render()">

<select id="buildingFilter" onchange="render()">
<option value="">Tất cả tòa</option>
</select>

<button class="add" onclick="addStaff()">➕ Thêm nhân viên</button>
</div>

<!-- CARDS -->
<div class="cards">
<div class="card"><h4>Tổng nhân viên</h4><p id="total">0</p></div>
<div class="card"><h4>Tổng tòa quản lý</h4><p id="buildCount">0</p></div>
</div>

<!-- TABLE -->
<div class="section">
<table>
<thead>
<tr>
<th>Mã</th>
<th>Tên</th>
<th>Tài khoản</th>
<th>Tòa quản lý</th>
<th>Số tòa</th>
<th>Hành động</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">

<h3 id="modalTitle">Thêm nhân viên</h3>

<input id="mName" placeholder="Tên nhân viên">
<input id="mUsername" placeholder="Tài khoản">
<input id="mBuildings" placeholder="Tòa (VD: B1,B2)">

<div class="modal-actions">
<button onclick="saveStaff()">💾 Lưu</button>
<button onclick="closeModal()">❌ Hủy</button>
</div>

</div>
</div>

<script src="../Common/menu.js"></script>
<script src="../Common/data.js"></script>
<script src="staff.js"></script>

</body>
</html>
