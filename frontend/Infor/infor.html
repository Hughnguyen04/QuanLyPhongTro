<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thông tin của tôi</title>
    <link rel="stylesheet" href="../Common/layout.css">
    <link rel="stylesheet" href="infor.css">
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Thông tin của tôi</h2>
    </div>

    <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

        <!-- USER MENU -->
        <div class="user-menu" id="userMenu">
            <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
            <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
            <div onclick="logout()">🚪 Đăng xuất</div>
        </div>
    </div>
</div>

<!-- WRAPPER -->
<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- MAIN -->
    <div class="main">

        <div class="welcome">
            <h2 id="welcomeName">👋 Chào</h2>
            <div id="today"></div>
        </div>

        <div class="profile">
            <div class="avatar">👤</div>
            <div>
                <h3 id="fullName"></h3>
                <div class="role" id="role"></div>
            </div>
        </div>

        <div class="info-grid" id="infoGrid"></div>

    </div>
</div>

<!-- SCRIPT -->
<script src="../Common/menu.js"></script>
<script src="../Common/data.js"></script>
<script src="infor.js"></script>

</body>
</html>
