<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Quản lý phòng trọ</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="login-box">
    <h2>🏠 Đăng nhập hệ thống</h2>

    <div class="input-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="off">
    </div>

    <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu">
    </div>

    <button onclick="login()">Đăng nhập</button>

    <div class="actions">
        <a onclick="openModal('forgot')">Quên mật khẩu?</a>
    </div>

    <div class="result" id="result"></div>
</div>

<!-- Modal Quên mật khẩu -->
<div class="modal" id="forgot">
    <div class="modal-box">
        <div class="close" onclick="closeModal('forgot')">✖</div>
        <h3>🔐 Quên mật khẩu</h3>

        <div class="input-group">
            <label>Email đã đăng ký</label>
            <input type="email" id="forgotEmail" placeholder="Nhập email của bạn">
        </div>

        <button onclick="forgotPassword()">Gửi yêu cầu</button>
        <div class="result" style="margin-top: 10px;"></div>
    </div>
</div>

<script src="login.js"></script>
</body>
</html>
