<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý hợp đồng</title>
<link rel="stylesheet" href="../Common/layout.css">
<link rel="stylesheet" href="contracts.css">
</head>

<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Quản lý hợp đồng</h2>
    </div>

    <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

        <div class="user-menu" id="userMenu">
            <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
            <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
            <div onclick="logout()">🚪 Đăng xuất</div>
        </div>
    </div>
</div>

<div class="wrapper">

<div class="sidebar" id="sidebar"></div>

<div class="main">

<div class="toolbar">
<input id="key" placeholder="🔍 Tìm người thuê..." oninput="render()">

<select id="buildingFilter" onchange="render()">
<option value="">Tất cả tòa</option>
</select>

<button class="add" onclick="openAdd()">➕ Thêm hợp đồng</button>
</div>

<div class="cards">
<div class="card"><h4>Tổng hợp đồng</h4><p id="total">0</p></div>
<div class="card"><h4>Đang hiệu lực</h4><p id="active">0</p></div>
<div class="card"><h4>Hết hạn</h4><p id="expired">0</p></div>
</div>

<div class="section">
<table>
<thead>
<tr>
<th>Mã</th>
<th>Người thuê</th>
<th>Phòng</th>
<th>Tòa</th>
<th>Bắt đầu</th>
<th>Kết thúc</th>
<th>Giá thuê</th>
<th>Cọc</th>
<th>Trạng thái</th>
<th>Hành động</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>
</div>

</div>
</div>


<!-- MODAL -->

<div class="modal" id="modal">

<div class="box">

<h3 id="modalTitle">Thêm hợp đồng</h3>

<input id="mTenant" placeholder="Người thuê">
<input id="mRoom" placeholder="Phòng">
<input id="mBuilding" placeholder="Tòa">

<input id="mStart" type="date">
<input id="mEnd" type="date">

<input id="mRent" placeholder="Giá thuê">
<input id="mDeposit" placeholder="Tiền cọc">

<div class="modal-actions">
<button onclick="saveContract()">💾 Lưu</button>
<button onclick="closeModal()">❌ Hủy</button>
</div>

</div>
</div>


<script src="../Common/menu.js"></script>
<script src="api.js"></script>
<script src="contracts.js"></script>

</body>
</html>
