<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người thuê</title>
    <link rel="stylesheet" href="../Common/layout.css">
    <link rel="stylesheet" href="tenants.css">
</head>

<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Quản lý người thuê</h2>
    </div>

        <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

        <div class="user-menu" id="userMenu">
            <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
            <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
            <div onclick="logout()">🚪 Đăng xuất</div>
        </div>
    </div>
</div>

<div class="wrapper">
    <div class="sidebar" id="sidebar"></div>

    <div class="main">

        <!-- STATS -->
        <div class="cards">
            <div class="card">
                <h4>Tổng người thuê</h4>
                <p id="totalTenants">0</p>
            </div>
            <div class="card">
                <h4>Nam</h4>
                <p id="maleCount">0</p>
            </div>
            <div class="card">
                <h4>Nữ</h4>
                <p id="femaleCount">0</p>
            </div>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <input id="key" placeholder="🔍 Tìm theo tên, CCCD, SĐT..." oninput="render()">
            <button class="add" onclick="openAddTenant()">➕ Thêm người thuê</button>
        </div>

        <!-- TABLE -->
        <div class="section">
            <table>
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Họ tên</th>
                        <th>CCCD</th>
                        <th>SĐT</th>
                        <th>Email</th>
                        <th>Giới tính</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="box">
        <h3 id="modalTitle">Thêm người thuê</h3>

        <input id="mName" placeholder="Họ tên *">
        <input id="mCCCD" placeholder="CCCD">
        <input id="mPhone" placeholder="SĐT *">
        <input id="mEmail" placeholder="Email">
        <input id="mAddress" placeholder="Địa chỉ">
        <input id="mBirth" type="date" placeholder="Ngày sinh">
        
        <select id="mGender">
            <option value="NAM">Nam</option>
            <option value="NU">Nữ</option>
        </select>

        <input id="mNote" placeholder="Ghi chú (không bắt buộc)">

        <div class="modal-actions">
            <button onclick="saveTenant()">💾 Lưu</button>
            <button onclick="closeModal()">❌ Hủy</button>
        </div>
    </div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
    <div class="box">
        <h3>📋 Thông tin chi tiết</h3>

        <p><strong>👤 Họ tên:</strong> <span id="dName"></span></p>
        <p><strong>🆔 CCCD:</strong> <span id="dCCCD"></span></p>
        <p><strong>📞 SĐT:</strong> <span id="dPhone"></span></p>
        <p><strong>📧 Email:</strong> <span id="dEmail"></span></p>
        <p><strong>🎂 Ngày sinh:</strong> <span id="dBirth"></span></p>
        <p><strong>⚥ Giới tính:</strong> <span id="dGender"></span></p>
        <p><strong>📍 Địa chỉ:</strong> <span id="dAddress"></span></p>
        <p><strong>📝 Ghi chú:</strong> <span id="dNote"></span></p>

        <button onclick="closeDetail()" style="width: 100%; margin-top: 20px; padding: 10px; background: #6c63ff; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600;">Đóng</button>
    </div>
</div>

<script src="../Common/menu.js"></script>
<script src="api.js"></script>
<script src="tenants.js"></script>

</body>
</html>
