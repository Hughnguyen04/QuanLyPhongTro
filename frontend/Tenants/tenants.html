<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người thuê</title>
    <link rel="stylesheet" href="tenants.css">
</head>

<body>

<div class="topbar">
    <div class="left">
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h2>Quản lý người thuê</h2>
    </div>

    <div class="user-box" onclick="toggleUserMenu()">
        <div class="avatar-text">👤</div>
        <span id="username"></span>

    <div class="user-menu" id="userMenu">
        <div onclick="openMyInfo()">👤 Thông tin của tôi</div>
        <div onclick="openChangePass()">🔒 Đổi mật khẩu</div>
        <div onclick="logout()">🚪 Đăng xuất</div>
    </div>
    </div>
</div>

<div class="wrapper">

    <div class="sidebar" id="sidebar"></div>

    <div class="main">

        <!-- TOOLBAR -->
        <div class="toolbar">
            <input id="key" placeholder="🔍 Tìm theo tên người thuê..." oninput="render()">

            <select id="roomFilter" onchange="render()">
                <option value="">Tất cả phòng</option>
            </select>

            <select id="statusFilter" onchange="render()">
                <option value="">Tất cả trạng thái</option>
                <option value="Đang thuê">Đang thuê</option>
                <option value="Đã rời">Đã rời</option>
            </select>

            <button class="add">➕ Thêm người thuê</button>
        </div>

        <!-- CARDS -->
        <div class="cards">
            <div class="card"><h4>Tổng người thuê</h4><p id="total">0</p></div>
            <div class="card"><h4>Đang ở</h4><p id="dang">0</p></div>
            <div class="card"><h4>Đã rời</h4><p id="roi">0</p></div>
        </div>

        <!-- TABLE -->
        <div class="section">
            <table>
                <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th>Phòng</th>
                        <th>Tòa</th>
                        <th>Điện thoại</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="../Common/menu.js"></script>
<script src="../Common/data.js"></script>
<script src="tenants.js"></script>

</body>
</html>
