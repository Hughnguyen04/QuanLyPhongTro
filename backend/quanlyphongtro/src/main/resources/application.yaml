server:
  port: 8080
  servlet:
    context-path: /quanlyphongtro

spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/quanlyphongtro2?userSSL=false&serverTimezone=UTC"
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver # class driver của mysql
  jpa:
    hibernate:
      ddl-auto: update # hibernate tự động cập nhật db theo entity
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true # in sql ra console
    properties:
      hibernate:
        format-sql: true # format lại sql